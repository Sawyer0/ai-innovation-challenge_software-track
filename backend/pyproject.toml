[project]
name = "dja-backend"
version = "0.1.0"
description = "Compliance-aware AI academic advising API for CUNY students"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in argument defaults is the framework idiom
    "E501",   # long prompt strings and messages; the formatter handles code width
    "RUF001", # en dashes in user-facing copy are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: slow tests (end-to-end flows)",
    "unit: fast unit tests",
    "integration: API tests against a test database",
    "data_quality: checks on the bundled catalog data",
    "e2e: end-to-end workflow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
